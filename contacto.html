<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contacto - Felipe Bravo Miranda</title>
  <meta name="description" content="Contacta con Felipe Bravo Miranda, Analista de Sistemas en Daia Systems.">
  <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-black font-inter text-white min-h-screen flex flex-col">
  <!-- Navigation -->
  <nav class="sticky top-0 z-50 bg-black border-b border-gray-800">
    <div class="max-w-4xl mx-auto px-6 py-4">
      <div class="flex items-center justify-between">
        <a href="/" class="text-xl font-semibold text-white hover:text-gray-300 transition-colors logo-link nav-link" id="logo-link">fgbravom</a>
        <div class="hidden md:flex space-x-6">
          <a href="/sobremi.html" class="text-gray-300 hover:text-white transition-colors nav-link" data-page="sobremi">Sobre mí</a>
          <a href="/proyectos.html" class="text-gray-300 hover:text-white transition-colors nav-link" data-page="proyectos">Proyectos</a>
          <a href="/tecnologias.html" class="text-gray-300 hover:text-white transition-colors nav-link" data-page="tecnologias">Tecnologías</a>
          <a href="/contacto.html" class="text-gray-300 hover:text-white transition-colors nav-link active font-bold" data-page="contacto">Contacto</a>
        </div>
        <button
          id="mobile-menu-button"
          class="md:hidden text-white focus:outline-none"
          aria-label="Abrir menú de navegación"
          aria-expanded="false"
          aria-controls="mobile-menu">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
        </button>
      </div>
      <div id="mobile-menu" class="md:hidden hidden absolute left-0 right-0 top-full bg-black border-b border-gray-800 shadow-lg pb-4 z-50">
        <div class="flex flex-col space-y-3 px-6 pt-4">
          <a href="/sobremi.html" class="text-gray-300 hover:text-white transition-colors py-2 nav-link" data-page="sobremi">Sobre mí</a>
          <a href="/proyectos.html" class="text-gray-300 hover:text-white transition-colors py-2 nav-link" data-page="proyectos">Proyectos</a>
          <a href="/tecnologias.html" class="text-gray-300 hover:text-white transition-colors py-2 nav-link" data-page="tecnologias">Tecnologías</a>
          <a href="/contacto.html" class="text-gray-300 hover:text-white transition-colors py-2 nav-link active font-bold" data-page="contacto">Contacto</a>
        </div>
      </div>
    </div>
  </nav>

  <main class="flex-1 flex flex-col items-center justify-center py-20 px-6">
    <div class="w-full max-w-2xl">
      <div class="text-center mb-16">
        <h1 class="text-5xl md:text-6xl font-black mb-6 text-white tracking-tight">
          📫 Contacto
        </h1>
        <div class="w-24 h-1 bg-white mx-auto mb-6"></div>
        <p class="text-xl md:text-2xl text-gray-300 font-light leading-relaxed">
          ¿Tienes alguna pregunta o propuesta? Completa el formulario y me pondré en contacto contigo lo antes posible.
        </p>
      </div>

      <div class="bg-black rounded-2xl border-2 border-white/20 p-10 hover:border-white/40 transition-all duration-300">

        <form id="contactForm" class="space-y-6">
          <div>
            <label for="nombre" class="block text-base font-bold text-white mb-3 uppercase tracking-wider">Nombre</label>
            <input type="text" id="nombre" name="nombre" required
                   class="w-full px-5 py-4 border-2 border-white/20 rounded-lg focus:border-white focus:outline-none transition-colors bg-black text-white placeholder-gray-500 font-mono"
                   placeholder="Tu nombre completo" />
          </div>

          <div>
            <label for="correo" class="block text-base font-bold text-white mb-3 uppercase tracking-wider">Correo electrónico</label>
            <input type="email" id="correo" name="correo" required
                   class="w-full px-5 py-4 border-2 border-white/20 rounded-lg focus:border-white focus:outline-none transition-colors bg-black text-white placeholder-gray-500 font-mono"
                   placeholder="tu@correo.com" />
          </div>

          <div>
            <label for="telefono" class="block text-base font-bold text-white mb-3 uppercase tracking-wider">Teléfono <span class="text-gray-400 font-normal normal-case">(opcional)</span></label>
            <input type="tel" id="telefono" name="telefono"
                   class="w-full px-5 py-4 border-2 border-white/20 rounded-lg focus:border-white focus:outline-none transition-colors bg-black text-white placeholder-gray-500 font-mono"
                   placeholder="+56 9 1234 5678" />
          </div>

          <div>
            <label for="mensaje" class="block text-base font-bold text-white mb-3 uppercase tracking-wider">Mensaje</label>
            <textarea id="mensaje" name="mensaje" rows="6" required
                      class="w-full px-5 py-4 border-2 border-white/20 rounded-lg focus:border-white focus:outline-none transition-colors bg-black text-white placeholder-gray-500 resize-none font-mono"
                      placeholder="Escribe tu mensaje aquí..."></textarea>
          </div>

          <button type="submit"
                  class="w-full bg-black border-2 border-white/30 text-white py-4 px-8 rounded-xl font-bold text-lg hover:border-white hover:translate-x-1 hover:translate-y-1 hover:shadow-[6px_6px_0px_0px_rgba(255,255,255,0.2)] transition-all duration-200 uppercase tracking-wider">
            Enviar mensaje
          </button>

          <p id="estadoEnvio" class="text-center"></p>
        </form>

        <!-- Popup de confirmación -->
        <div id="popup" class="hidden fixed inset-0 bg-black bg-opacity-80 items-center justify-center z-50">
          <div class="bg-black border-2 border-white rounded-2xl p-10 max-w-md mx-4 text-center">
            <div class="text-7xl mb-6">✅</div>
            <p class="text-2xl font-black text-white mb-8 tracking-tight">¡Mensaje enviado correctamente!</p>
            <button id="closePopup"
                    class="bg-black border-2 border-white/30 text-white px-8 py-3 rounded-xl font-bold hover:border-white hover:translate-x-1 hover:translate-y-1 hover:shadow-[6px_6px_0px_0px_rgba(255,255,255,0.2)] transition-all duration-200 uppercase tracking-wider">
              Cerrar
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="bg-black text-white py-12 mt-0" role="contentinfo">
    <div class="max-w-4xl mx-auto px-6 text-center">
      <p class="text-gray-400">Desarrollado por <span class="text-white font-medium">fgbravom</span></p>
    </div>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
